name: WorkBuddy Daily Checkin

on:
  schedule:
    # 注意：GitHub Actions 的 schedule 实测有 4.5–5.8 小时的稳定排队延迟
    # （cron 写 01:05Z，实际创建时间稳定落在 05:31–06:02Z）。所以下面各班都只是"发车时间"，
    # 实际执行会晚 4.5 小时左右，但都落在同一个自然日内（最晚一班约北京 23:30）。
    #
    # 设四班的原因：2026-09-23 出现 runner 侧到接口连续约 40 分钟不可达，
    # 单班次正好撞上就整段失败（当天 0/5）；而脚本内部的重试窗口只有约 90 秒，
    # 差 27 倍，救不回来。多班次是唯一能覆盖"小时级链路故障"的手段。
    # 签到接口是幂等的（已签到会返回"今日已签到"并视为成功），重复跑无副作用。
    - cron: "5 1 * * *"    # 名义 09:05（北京），实测约 13:35 执行
    - cron: "5 4 * * *"    # 名义 12:05（北京），实测约 16:35 执行
    - cron: "5 7 * * *"    # 名义 15:05（北京），实测约 19:35 执行
    - cron: "5 10 * * *"   # 名义 18:05（北京），实测约 22:35 执行
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    # 加固后最坏路径（全账号网络超时）：5×(3×20s 超时 + 7s 退避) ×2 轮 + 90s 间隔
    # ≈ 12.7 分钟。必须留足余量 —— 若超时被强杀，job 照样报红且日志残缺。
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run checkin
        env:
          # 多账号：JSON 数组，格式见 secrets-WORKBUDDY_ACCOUNTS.json（本地已生成，勿提交）
          # [{"access_token":"...","account_name":"...","uid":"..."}, ...]
          WORKBUDDY_ACCOUNTS: ${{ secrets.WORKBUDDY_ACCOUNTS }}
        run: python checkin.py
