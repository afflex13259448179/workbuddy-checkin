name: WorkBuddy Daily Checkin

on:
  schedule:
    # 注意：GitHub Actions 的 schedule 实测有约 4.5 小时排队延迟（cron 写 01:05Z，
    # 实际创建时间稳定落在 05:31–05:59Z）。所以下面两班都只是"发车时间"，
    # 实际执行会晚 4 小时左右，但都落在同一个自然日内。
    # 设两班是为了兜底：schedule 事件偶发被丢弃时不至于当天整段漏跑。
    # 签到接口是幂等的（已签到会返回"今日已签到"并视为成功），重复跑无副作用。
    - cron: "5 1 * * *"   # 名义 09:05（北京），实测约 13:35 执行
    - cron: "5 4 * * *"   # 名义 12:05（北京），实测约 16:35 执行
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run checkin
        env:
          # 多账号：JSON 数组，格式见 secrets-WORKBUDDY_ACCOUNTS.json（本地已生成，勿提交）
          # [{"access_token":"...","account_name":"...","uid":"..."}, ...]
          WORKBUDDY_ACCOUNTS: ${{ secrets.WORKBUDDY_ACCOUNTS }}
        run: python checkin.py
